<script>
  function parseFrontmatter(raw){
    const match = raw.match(/^---\s*\n([\s\S]*?)\n---\s*\n?([\s\S]*)$/);
    if(!match) return { data:{}, content: raw };
    const data = {};
    match[1].split('\n').forEach(line=>{
      const i = line.indexOf(':');
      if(i === -1) return;
      const key = line.slice(0,i).trim();
      const val = line.slice(i+1).trim().replace(/^["']|["']$/g,'');
      data[key] = val;
    });
    return { data, content: match[2] };
  }

  function formatDate(d){
    if(!d) return '';
    const date = new Date(d + 'T00:00:00');
    return date.toLocaleDateString('en-US', {month:'long', day:'numeric', year:'numeric'});
  }

  // Shield $...$ / $$...$$ spans from marked (it eats underscores/asterisks),
  // then restore them HTML-escaped for KaTeX auto-render. Mirrors tools/build.js.
  function escHtml(s){
    return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
      .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function protectMath(content){
    const math = [];
    const stash = m => `@@MATH${math.push(m) - 1}@@`;
    const processed = content
      .split(/(```[\s\S]*?```|`[^`\n]*`)/)
      .map((seg, i) => i % 2 === 1 ? seg : seg
        .replace(/\$\$[\s\S]+?\$\$/g, stash)
        .replace(/(?<!\\)\$(?!\s)([^$\n]+?)(?<!\s)\$/g, stash))
      .join('');
    return { processed, math };
  }
  function restoreMath(html, math){
    // \(...\)/\[...\] delimiters so auto-render only touches identified spans.
    return html.replace(/@@MATH(\d+)@@/g, (_, i) => {
      const m = math[+i];
      return m.startsWith('$$')
        ? '\\[' + escHtml(m.slice(2, -2)) + '\\]'
        : '\\(' + escHtml(m.slice(1, -1)) + '\\)';
    });
  }
  function renderMath(el){
    const go = () => renderMathInElement(el, {
      delimiters: [
        {left: '\\(', right: '\\)', display: false},
        {left: '\\[', right: '\\]', display: true}
      ],
      throwOnError: false
    });
    if(typeof renderMathInElement !== 'undefined') go();
    else window.addEventListener('load', go);
  }

  async function loadPost(){
    const params = new URLSearchParams(window.location.search);
    const slug = params.get('slug');
    const bodyEl = document.getElementById('post-body');
    const titleEl = document.getElementById('post-title');
    const metaEl = document.getElementById('post-meta');

    if(!slug){
      titleEl.textContent = 'Post not found';
      bodyEl.innerHTML = '<p>No post specified.</p>';
      return;
    }

    // Prefer the pre-rendered page (tools/build.js) when it exists;
    // fall back to client-side rendering for unlisted drafts.
    try{
      const head = await fetch(`posts/${encodeURIComponent(slug)}.html`, {method:'HEAD'});
      if(head.ok){
        location.replace(`posts/${encodeURIComponent(slug)}.html`);
        return;
      }
    }catch(e){ /* offline or file:// — fall through to client render */ }

    try{
      const res = await fetch(`posts/${slug}.md`);
      if(!res.ok) throw new Error('not found');
      const raw = await res.text();
      const { data, content } = parseFrontmatter(raw);

      titleEl.textContent = data.title || slug;
      document.getElementById('page-title').textContent = `${data.title || slug} — Jimrox`;
      metaEl.textContent = formatDate(data.date);

      const { processed, math } = protectMath(content);
      bodyEl.innerHTML = restoreMath(marked.parse(processed), math);
      bodyEl.querySelectorAll('pre code').forEach(el => hljs.highlightElement(el));
      if(math.length) renderMath(bodyEl);
    }catch(err){
      titleEl.textContent = 'Post not found';
      bodyEl.innerHTML = '<p>That post doesn\'t exist yet.</p>';
      console.error(err);
    }
  }
  loadPost();
</script>
